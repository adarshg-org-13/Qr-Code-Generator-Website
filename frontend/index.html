<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QrCG — QR Code Generator</title>
</head>
<body>

  <h1>QrCG</h1>
  <p>QR Code Generator</p>

  <br/>

  <label for="qr-text">URL or Text</label><br/>
  <input type="text" id="qr-text" placeholder="https://example.com" autocomplete="off" style="width:300px;"/><br/><br/>


  <label for="style">Module Style</label><br/>
  <select id="style">
    <option value="square">Square</option>
    <option value="rounded">Rounded</option>
    <option value="circle">Circle</option>
  </select><br/><br/>


  <label for="ec">Error Correction</label><br/>
  <select id="ec">
    <option value="L">Low — 7%</option>
    <option value="M" selected>Medium — 15%</option>
    <option value="Q">Quartile — 25%</option>
    <option value="H">High — 30%</option>
  </select><br/><br/>


  <label>Size: <span id="size-val">10</span></label><br/>
  <input type="range" id="size" min="5" max="20" value="10"
    oninput="document.getElementById('size-val').textContent = this.value"/><br/><br/>


  <label>Border: <span id="border-val">4</span></label><br/>
  <input type="range" id="border" min="0" max="8" value="4"
    oninput="document.getElementById('border-val').textContent = this.value"/><br/><br/>


  <label for="fg-pick">Foreground Color</label><br/>
  <input type="color" id="fg-pick" value="#000000"
    oninput="document.getElementById('fg-hex').textContent = this.value"/>
  <span id="fg-hex">#000000</span><br/><br/>


  <label for="bg-pick">Background Color</label><br/>
  <input type="color" id="bg-pick" value="#ffffff"
    oninput="document.getElementById('bg-hex').textContent = this.value"/>
  <span id="bg-hex">#ffffff</span><br/><br/>


  <button id="gen-btn" onclick="generate()">Generate</button>
  <p id="err" style="color:red; display:none;"></p>

  <br/>

  <div id="placeholder"><p>Awaiting input...</p></div>

  <div id="result" style="display:none;">
    <img id="qr-img" src="" alt="Generated QR Code" style="width:200px; height:200px; display:block; margin-top:10px;"/><br/>
    <a id="dl-btn" download="qrcode.png">Download PNG</a>
  </div>

  <script>
    const API = "";

    document.getElementById('qr-text').addEventListener('keydown', e => {
      if (e.key === 'Enter') generate();
    });

    async function generate() {
      const text   = document.getElementById('qr-text').value.trim();
      const errEl  = document.getElementById('err');
      errEl.style.display = 'none';

      if (!text) {
        errEl.textContent = 'Please enter a URL or text.';
        errEl.style.display = 'block';
        return;
      }

      const style  = document.getElementById('style').value;
      const ec     = document.getElementById('ec').value;
      const size   = document.getElementById('size').value;
      const border = document.getElementById('border').value;
      const fg     = document.getElementById('fg-pick').value.replace('#', '');
      const bg     = document.getElementById('bg-pick').value.replace('#', '');

      const btn    = document.getElementById('gen-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('result').style.display = 'none';

      const url = `${API}/generate`
        + `?text=${encodeURIComponent(text)}`
        + `&size=${size}`
        + `&border=${border}`
        + `&fg_color=${fg}`
        + `&bg_color=${bg}`
        + `&style=${style}`
        + `&error_correction=${ec}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${res.status}`);
        const blob = await res.blob();
        const src  = URL.createObjectURL(blob);

        document.getElementById('qr-img').src = src;
        document.getElementById('dl-btn').href = src;
        document.getElementById('dl-btn').download = `qrcode-${Date.now()}.png`;
        document.getElementById('result').style.display = 'block';

      } catch (e) {
        document.getElementById('placeholder').style.display = 'block';
        errEl.textContent = 'Could not reach backend. Check your deployment.';
        errEl.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  </script>

</body>
</html>
